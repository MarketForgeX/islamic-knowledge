name: Deploy Islamic Knowledge to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate runtime API configuration
        env:
          AMANAH_API_KEY: ${{ secrets.AMANAH_API_KEY }}
        run: |
          if [ -z "$AMANAH_API_KEY" ]; then
            echo "AMANAH_API_KEY repository secret is missing."
            exit 1
          fi
          printf 'window.AMANAH_API_KEY = %s;\n' "$(printf '%s' "$AMANAH_API_KEY" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > runtime-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
